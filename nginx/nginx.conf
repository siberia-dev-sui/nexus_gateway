# Cache en disco para imágenes de producto (el gateway las sirve desde
# Postgres; nginx absorbe los hits repetidos sin tocar Node ni la BD).
proxy_cache_path /var/cache/nginx/product_images levels=1:2
                 keys_zone=product_images:10m max_size=300m
                 inactive=7d use_temp_path=off;

# Conexiones persistentes hacia el gateway: sin esto cada request paga
# un handshake TCP nuevo contra Node.
upstream nexus_gateway_upstream {
    server gateway:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name nexus.eqnio.com;

    # Desafío ACME de Let's Encrypt servido por este nginx (modo webroot).
    # Sin esto la renovación automática falla: certbot en modo standalone
    # no puede tomar el puerto 80 porque nginx lo ocupa.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nexus.eqnio.com;

    ssl_certificate     /etc/letsencrypt/live/nexus.eqnio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.eqnio.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # La app sube fotos en chunks JSON/base64 (fastify bodyLimit = 25 MB).
    client_max_body_size 30m;

    # Compresión: el catálogo/stock/price book son JSON grandes que
    # comprimen ~75-80%. Clave para vendedores con red móvil lenta.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;

    # Imágenes de producto: cacheadas en nginx 7 días. Si el gateway o la
    # BD están caídos, se sirve la copia stale.
    location /api/v1/product/ {
        proxy_pass         http://nexus_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache            product_images;
        proxy_cache_key        $request_uri;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      404 5m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_lock       on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass         http://nexus_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
